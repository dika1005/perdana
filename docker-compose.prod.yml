services:
  # 1. Database MySQL / MariaDB
  db:
    image: mariadb:11
    container_name: perdana-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - perdana_db_data:/var/lib/mysql
    networks:
      - perdana-network

  # 2. Backend Rust (Actix Web)
  backend:
    image: ${BACKEND_IMAGE:-perdana-backend:latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: perdana-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8800
      RUST_LOG: ${RUST_LOG:-info}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECS: ${JWT_ACCESS_TTL_SECS:-28800}
      JWT_REFRESH_TTL_SECS: ${JWT_REFRESH_TTL_SECS:-604800}
      STORE_NAME: ${STORE_NAME:-"PERDANA PRINTING & POS"}
      STORE_ADDRESS: ${STORE_ADDRESS:-"Jl. Percetakan Perdana No. 1, Kota"}
      STORE_PHONE: ${STORE_PHONE:-"0812-3456-7890"}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    networks:
      - perdana-network

  # 3. Frontend Next.js
  frontend:
    image: ${FRONTEND_IMAGE:-perdana-frontend:latest}
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    container_name: perdana-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8800
    networks:
      - perdana-network

  # 4. Reverse Proxy & SSL Caddy
  caddy:
    image: caddy:2-alpine
    container_name: perdana-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - perdana-network

volumes:
  perdana_db_data:
  caddy_data:
  caddy_config:

networks:
  perdana-network:
    driver: bridge
